version: "3.8"

services:
  tool-server:
    build: ./tool_server
    container_name: rhosp-agent-tool-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # clouds.yaml must exist locally first - copy clouds.yaml.example and fill it in.
      - ./clouds.yaml:/config/clouds.yaml:ro
      # ONE directory holding every cloud's CA cert file. Mounted at the same
      # absolute path it has on the host, so the same clouds.yaml works
      # unchanged for both host-side `openstack` CLI testing and this
      # container - the container's filesystem is otherwise isolated, so a
      # host path referenced in cacert: would be invisible here without this.
      # Adding a new cloud = drop its cert file in ./ca-certs/ and reference
      # it in clouds.yaml - no docker-compose.yml change needed, ever.
      - ./ca-certs:/data/RHOSP-AGENT/RHOSP-AGENT/ca-certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rhosp-agent-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Point at the vLLM OpenAI-compatible endpoint once it's running (see README).
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - OPENAI_API_KEY=local-key
      - WEBUI_AUTH=true
      # Without these, huggingface_hub does an online "check for updates" call for
      # the RAG embedding model on every startup - even if it's already cached -
      # which HANGS (not fails) when there's no internet, leaving the container
      # stuck forever at "Waiting for application startup" and never healthy.
      # Forces using ONLY the local cache: instant if it's there, a fast clear
      # error instead of a silent hang if it isn't.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    extra_hosts:
      # host.docker.internal resolves automatically on Docker Desktop (Mac/Windows)
      # but NOT on native Linux Docker Engine - which is what the VM runs. Without
      # this, Open WebUI can't reach vLLM on the host and silently shows no models.
      - "host.docker.internal:host-gateway"
    depends_on:
      - tool-server

  # vLLM is intentionally NOT containerized here since it needs GPU passthrough
  # and a locally-transferred model directory that varies per deployment. Run it
  # directly on the VM (see README.md "Serve the model") once the model has been
  # copied over. Once running, its OpenAI-compatible API on :8000 is what
  # OPENAI_API_BASE_URL above points to.
  #
  # If you'd rather containerize it too:
  #
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: rhosp-agent-vllm
  #   restart: unless-stopped
  #   runtime: nvidia
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #   volumes:
  #     - ./models/<model-dir>:/model:ro
  #   command: ["--model", "/model", "--max-model-len", "8192", "--api-key", "local-key"]
  #   ports:
  #     - "8000:8000"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  open-webui-data:
